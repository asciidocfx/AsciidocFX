<!DOCTYPE html>
<html>
<head>
    <title>AsciidocFX Editor</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/afx/resource/css/?p=css/three-dots.css" type="text/css"/>
    <link rel="stylesheet" href="/afx/dynamic/css/?p=asciidoctor-default-overrides.css"/>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get("theme") === "dark") {
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "/afx/dynamic/css/?p=asciidoctor-preview-theme.css&mode=dark";
                document.head.appendChild(link);
            }
        })();
    </script>
</head>
<body>
<div class="asciidocfx-container">
    <div id="placeholder">
        <div style="margin-top: 40px;display: flex;align-items: center;justify-content: center">
            <div class="dot-collision"></div>
        </div>
    </div>
</div>

<script id="put-js"></script>

<script src="/afx/resource/js/?p=js/jquery.js"></script>
<script src="/afx/resource/js/?p=js/rafThrottle.js"></script>
<script src="/afx/resource/js/?p=js/buffhelper.js"></script>
<script src="/afx/resource/js/?p=js/sockjs.js"></script>
<script src="/afx/resource/js/?p=js/morphdom-options.js"></script>
<script src="/afx/resource/js/?p=js/morphdom.js"></script>
<script src="/afx/resource/js/?p=js/index.js"></script>
</body>
</html>
